spring.application.name=finanx-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/finanx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finanx}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finanx_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG

management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS